<template id="tmpl-sign-attributes">
        <div class="widget-content widget-sign-attributes" style="display: flex; flex-direction: column; height: 100%;">
            <div class="chart-toolbar" style="padding: 3px 8px; background: #f7f3eb; border-bottom: 1px solid #e5dccb; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: #4a3325; font-weight: bold; font-size: 12px; white-space: nowrap;">Sign Attributes & Anatomy</span>
                    <select class="varga-select" onchange="updateSignAttributesWidget(this.closest('.grid-cell'))" style="padding: 2px 4px; font-size: 11px; border-radius: 4px; border: 1px solid #d5c8b2; background: #fffdfa; color: #4a3325; font-weight: 600; max-width: 105px;">
                        <option value="D1" selected>D1 - Rāśi</option>
                        <option value="D2">D2 - Horā</option>
                        <option value="D3">D3 - Drekkāṇa</option>
                        <option value="D4">D4 - Caturthāṁśa</option>
                        <option value="D7">D7 - Saptāṁśa</option>
                        <option value="D9">D9 - Navāṁśa</option>
                        <option value="D10">D10 - Daśāṁśa</option>
                        <option value="D12">D12 - Dvādaśāṁśa</option>
                        <option value="D16">D16 - Ṣoḍaśāṁśa</option>
                        <option value="D20">D20 - Viṁśāṁśa</option>
                        <option value="D24">D24 - Caturviṁśāṁśa</option>
                        <option value="D27">D27 - Saptaviṁśāṁśa</option>
                        <option value="D30">D30 - Triṁśāṁśa</option>
                        <option value="D40">D40 - Khavedāṁśa</option>
                        <option value="D45">D45 - Akṣavedāṁśa</option>
                        <option value="D60">D60 - Ṣaṣṭyāṁśa</option>
                    </select>
                    <div class="sign-attr-pills" style="display: inline-flex; background: #eae1d1; border-radius: 4px; padding: 1px; gap: 1px;">
                        <button type="button" class="sign-attr-pill-btn active" onclick="switchSignAttrTab(this, 'matrix')" style="border:none; background:#fffdfa; color:#4a3325; font-weight:bold; font-size:10px; padding:2px 6px; border-radius:3px; cursor:pointer;">Triad Matrix (4×3)</button>
                        <button type="button" class="sign-attr-pill-btn" onclick="switchSignAttrTab(this, 'anatomy')" style="border:none; background:transparent; color:#6b5a4b; font-weight:bold; font-size:10px; padding:2px 6px; border-radius:3px; cursor:pointer;">Kalapurusha Anatomy</button>
                        <button type="button" class="sign-attr-pill-btn" onclick="switchSignAttrTab(this, 'polarity')" style="border:none; background:transparent; color:#6b5a4b; font-weight:bold; font-size:10px; padding:2px 6px; border-radius:3px; cursor:pointer;">Polarity & Rising</button>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <label style="font-size: 10.5px; font-weight: 600; color: #6b5a4b; display: flex; align-items: center; gap: 3px; cursor: pointer;" title="Include Lagna (Ascendant) in numeric counts">
                        <input type="checkbox" class="chk-count-lagna" onchange="updateSignAttributesWidget(this.closest('.grid-cell'))" style="cursor: pointer;"/> + Lagna
                    </label>
                    <button type="button" class="btn-widget-maximize" title="Maximize View" onclick="maximizeTableFromWidget(this)">⛶</button>
                </div>
            </div>
            <div class="responsive-table-container sign-attr-content" style="padding: 8px; flex: 1; overflow: auto; background: #faf6ef;">
            </div>
        </div>
    </template>
