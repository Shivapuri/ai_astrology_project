<template id="tmpl-report">
    <div class="widget-content widget-synthesis-report" style="display: flex; flex-direction: column; height: 100%; width: 100%; background: #faf6ef;">
        <!-- Top Toolbar -->
        <div class="chart-toolbar report-toolbar" style="padding: 4px 8px; background: #f7f3eb; border-bottom: 1px solid #e5dccb; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="color: #4a3325; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 4px;">
                    <span>📜</span> Astrological Synthesis Report
                </span>
                <div class="report-tab-pills" style="display: inline-flex; background: #eae1d1; border-radius: 4px; padding: 2px; gap: 2px;">
                    <button type="button" class="report-pill-btn active" data-tab="polarity" onclick="switchReportTab(this, 'polarity')" style="border:none; background:#fffdfa; color:#4a3325; font-weight:700; font-size:12px; padding:3px 8px; border-radius:3px; cursor:pointer;">🌟 Polarity &amp; Stars</button>
                    <button type="button" class="report-pill-btn" data-tab="environment" onclick="switchReportTab(this, 'environment')" style="border:none; background:transparent; color:#6b5a4b; font-weight:700; font-size:12px; padding:3px 8px; border-radius:3px; cursor:pointer;">🌿 Elements &amp; Axis</button>
                    <button type="button" class="report-pill-btn" data-tab="prominence" onclick="switchReportTab(this, 'prominence')" style="border:none; background:transparent; color:#6b5a4b; font-weight:700; font-size:12px; padding:3px 8px; border-radius:3px; cursor:pointer;">👑 Planetary Rank</button>
                    <button type="button" class="report-pill-btn" data-tab="synthesis" onclick="switchReportTab(this, 'synthesis')" style="border:none; background:transparent; color:#6b5a4b; font-weight:700; font-size:12px; padding:3px 8px; border-radius:3px; cursor:pointer;">🧪 Synthesis Desk</button>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <span class="report-dominant-badge" style="font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d;">Dominant: --</span>
                <button type="button" class="btn-widget-maximize" title="Maximize Report (Full Screen)" onclick="maximizeTableFromWidget(this)">⛶</button>
            </div>
        </div>

        <!-- Scrollable Report Body -->
        <div class="responsive-table-container report-body" style="padding: 10px; flex: 1; overflow-y: auto; overflow-x: hidden; background: #faf6ef;">
            <!-- Tab 1: Polarity Core & Stars -->
            <div class="report-tab-pane tab-polarity active" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Polarity Relationship Banner -->
                <div class="polarity-banner-container"></div>

                <!-- Dual Nakshatra Cards (Responsive side-by-side or stacked) -->
                <div class="polarity-cards-row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px;">
                    <div class="asc-nak-card-wrapper"></div>
                    <div class="moon-nak-card-wrapper"></div>
                </div>

                <!-- 4-Step Nakshatra Dominance Leaderboard -->
                <div class="nakshatra-dominance-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>

                <!-- Classical 7-Temperament Distribution -->
                <div class="temperament-distribution-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>

                <!-- All Occupied Nakshatras Table -->
                <div class="all-nakshatras-table-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>
            </div>

            <!-- Tab 2: Elements & Operational Axis -->
            <div class="report-tab-pane tab-environment" style="display: none; flex-direction: column; gap: 12px;">
                <!-- Operational Axis (Rashi vs Navamsha) -->
                <div class="operational-axis-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>

                <!-- Balance of Environmental Harmonics (Bi-Directional Graphic) -->
                <div class="environmental-distribution-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>

                <!-- Elements & Gunas Detailed Tallies -->
                <div class="environmental-tallies-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>
            </div>

            <!-- Tab 3: Planetary Prominence & Dignity -->
            <div class="report-tab-pane tab-prominence" style="display: none; flex-direction: column; gap: 12px;">
                <!-- Commander Spotlight -->
                <div class="commander-spotlight-container"></div>

                <!-- Prominence Leaderboard Table -->
                <div class="prominence-table-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 10px;"></div>
            </div>

            <!-- Tab 4: Synthesis Desk & 3-Way Cockpit -->
            <div class="report-tab-pane tab-synthesis" style="display: none; flex-direction: column; gap: 12px;">
                <!-- 3-Way Synthesis Cockpit -->
                <div class="synthesis-cockpit-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 12px;">
                    <!-- Header Bar -->
                    <div class="cockpit-header-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid #f1ece1;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 16px;">🎯</span>
                            <div>
                                <div style="font-size: 14px; font-weight: 700; color: #1e293b;">3-Way Synthesis Cockpit</div>
                                <div style="font-size: 12px; color: #64748b;">Planet + Sign + House Flowchart Triptych</div>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label for="select-synthesis-planet" style="font-size: 12.5px; font-weight: 600; color: #475569;">Focus Graha:</label>
                            <select id="select-synthesis-planet" class="select-synthesis-planet" style="padding: 5px 10px; font-size: 13px; font-weight: 600; color: #0f172a; background: #fffdfa; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; cursor: pointer; min-width: 280px;">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                    </div>

                    <!-- Context Sub-strip -->
                    <div id="cockpit-context-strip" class="cockpit-context-strip" style="margin: 10px 0; padding: 8px 12px; background: #fffdf5; border: 1px solid #fde68a; border-radius: 6px; font-size: 12.5px; color: #78350f; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                        <div class="context-ambient" style="display: flex; align-items: center; gap: 6px;">
                            <span style="font-weight: 700;">🌌 Ambient Context:</span>
                            <span class="context-ambient-text">--</span>
                        </div>
                        <div class="context-focus" style="display: flex; align-items: center; gap: 6px;">
                            <span style="font-weight: 700;">🪐 Placement Flavor:</span>
                            <span class="context-focus-text">--</span>
                        </div>
                    </div>

                    <!-- Triptych Grid (3 Columns) -->
                    <div id="cockpit-triptych-grid" class="cockpit-triptych-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px;">
                        <!-- Col 1: Planet Card -->
                        <div id="cockpit-card-planet" class="chart-card cockpit-card cockpit-card-planet" style="border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column;">
                            <div class="cockpit-card-header" style="padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="cockpit-symbol planet-symbol" style="font-size: 18px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 6px;">🪐</span>
                                    <span class="cockpit-title planet-title" style="font-size: 13.5px; font-weight: 700; color: #0f172a;">Planet</span>
                                </div>
                                <span class="formula-banner planet-formula" style="display: none; padding: 2px 8px; font-size: 11px;"></span>
                            </div>
                            <div class="cockpit-card-body" style="padding: 14px 10px; flex: 1; overflow-x: auto; min-height: 220px; display: flex; align-items: center; justify-content: center;">
                                <div id="cockpit-target-planet" class="mermaid-target cockpit-target-planet" style="width: 100%; display: flex; justify-content: center;"></div>
                            </div>
                        </div>

                        <!-- Col 2: Sign Card -->
                        <div id="cockpit-card-sign" class="chart-card cockpit-card cockpit-card-sign" style="border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column;">
                            <div class="cockpit-card-header" style="padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="cockpit-symbol sign-symbol" style="font-size: 18px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 6px;">♈</span>
                                    <span class="cockpit-title sign-title" style="font-size: 13.5px; font-weight: 700; color: #0f172a;">Sign</span>
                                </div>
                                <span class="formula-banner sign-formula" style="display: none; padding: 2px 8px; font-size: 11px;"></span>
                            </div>
                            <div class="cockpit-card-body" style="padding: 14px 10px; flex: 1; overflow-x: auto; min-height: 220px; display: flex; align-items: center; justify-content: center;">
                                <div id="cockpit-target-sign" class="mermaid-target cockpit-target-sign" style="width: 100%; display: flex; justify-content: center;"></div>
                            </div>
                        </div>

                        <!-- Col 3: House Card -->
                        <div id="cockpit-card-house" class="chart-card cockpit-card cockpit-card-house" style="border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; overflow: hidden; display: flex; flex-direction: column;">
                            <div class="cockpit-card-header" style="padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="cockpit-symbol house-symbol" style="font-size: 14px; font-weight: 800; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 6px; color: #475569;">H1</span>
                                    <span class="cockpit-title house-title" style="font-size: 13.5px; font-weight: 700; color: #0f172a;">House</span>
                                </div>
                                <span class="formula-banner house-formula" style="display: none; padding: 2px 8px; font-size: 11px;"></span>
                            </div>
                            <div class="cockpit-card-body" style="padding: 14px 10px; flex: 1; overflow-x: auto; min-height: 220px; display: flex; align-items: center; justify-content: center;">
                                <div id="cockpit-target-house" class="mermaid-target cockpit-target-house" style="width: 100%; display: flex; justify-content: center;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Interactive Interpretation Scratchpad -->
                    <div id="cockpit-scratchpad" class="cockpit-scratchpad" style="margin-top: 14px; background: #fbfcfe; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <span style="font-size: 15px;">📝</span>
                                <span style="font-size: 13.5px; font-weight: 700; color: #1e293b;">Synthesis Scratchpad &amp; Astrological Judgment</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="synth-save-status" style="font-size: 12px; color: #15803d; font-weight: 600; opacity: 0; transition: opacity 0.3s ease;">Saved to local cache ✓</span>
                                <button type="button" class="btn-save-synthesis" style="background: #2563eb; color: #ffffff; border: none; border-radius: 4px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s ease;">Save Notes</button>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;">
                            <!-- Box 1: Resonance -->
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <label for="txt-resonance" style="font-size: 12px; font-weight: 700; color: #0369a1; display: flex; align-items: center; gap: 4px;">
                                    <span>🔗 1. Resonance</span>
                                </label>
                                <div style="font-size: 11.5px; color: #64748b;">Where do these 3 symbols share common ground / resonate?</div>
                                <textarea id="txt-resonance" class="txt-resonance" placeholder="E.g. Jupiter (wisdom/guidance) in House 7 (advising others) and Scorpio (deep investigative truth)..." rows="3" style="width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12.5px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; outline: none; background: #ffffff; color: #0f172a;"></textarea>
                            </div>

                            <!-- Box 2: Dissonance -->
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <label for="txt-dissonance" style="font-size: 12px; font-weight: 700; color: #b91c1c; display: flex; align-items: center; gap: 4px;">
                                    <span>⚡ 2. Dissonance</span>
                                </label>
                                <div style="font-size: 11.5px; color: #64748b;">Where do they pull in opposite directions / clash?</div>
                                <textarea id="txt-dissonance" class="txt-dissonance" placeholder="E.g. Jupiter (open, trusting, student-receptive) clashes with Scorpio (secretive, skeptical)..." rows="3" style="width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12.5px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; outline: none; background: #ffffff; color: #0f172a;"></textarea>
                            </div>

                            <!-- Box 3: Synthesis -->
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <label for="txt-synthesis" style="font-size: 12px; font-weight: 700; color: #15803d; display: flex; align-items: center; gap: 4px;">
                                    <span>🔮 3. Synthesis</span>
                                </label>
                                <div style="font-size: 11.5px; color: #64748b;">Unified Astrological Judgment / Real-World Expression</div>
                                <textarea id="txt-synthesis" class="txt-synthesis" placeholder="E.g. The native becomes an incisive, independent teacher who resists conventional orthodoxy..." rows="3" style="width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12.5px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; outline: none; background: #ffffff; color: #0f172a;"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ingredients Checklist -->
                <div class="synthesis-desk-container" style="background: #ffffff; border: 1px solid #e5dccb; border-radius: 6px; padding: 12px;"></div>
            </div>
        </div>
    </div>
</template>
