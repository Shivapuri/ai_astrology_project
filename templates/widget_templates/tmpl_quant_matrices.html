<template id="tmpl-quant-matrices">
        <div class="widget-content">
            <div class="chart-toolbar" style="padding: 3px 8px; background: #f7f3eb; border-bottom: 1px solid #e5dccb; display: flex; justify-content: space-between; align-items: center; gap: 4px;">
                <div style="display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden;">
                    <strong class="quant-matrices-title" style="color: #4a3325; font-size: 12px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">Strength Matrices</strong>
                </div>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <label style="font-size: 11px; color: #666; font-weight: bold;">Varga:</label>
                    <select class="varga-select" onchange="updateWidget(this.closest('.grid-cell'))" style="padding: 2px 4px; font-size: 11px; border-radius: 4px; border: 1px solid #d5c8b2; background: #fffdfa; color: #4a3325; font-weight: 600; max-width: 80px;">
                        <option value="D1" selected>D1</option>
                        <option value="D2">D2</option>
                        <option value="D3">D3</option>
                        <option value="D4">D4</option>
                        <option value="D7">D7</option>
                        <option value="D9">D9</option>
                        <option value="D10">D10</option>
                        <option value="D12">D12</option>
                        <option value="D16">D16</option>
                        <option value="D20">D20</option>
                        <option value="D24">D24</option>
                        <option value="D27">D27</option>
                        <option value="D30">D30</option>
                        <option value="D40">D40</option>
                        <option value="D45">D45</option>
                        <option value="D60">D60</option>
                    </select>
                    <label style="font-size: 11px; color: #666; font-weight: bold;">Base:</label>
                    <select class="matrix-type-select" onchange="updateWidget(this.closest('.grid-cell'))" style="padding: 2px 4px; font-size: 11px; border-radius: 4px; border: 1px solid #d5c8b2; background: #fffdfa; color: #4a3325; font-weight: 600; max-width: 115px;">
                        <optgroup label="Lajjitadi Avasthas">
                            <option value="Drishti Yuti">Drishti Yuti</option>
                            <option value="ShadBala" selected>ShadBala</option>
                        </optgroup>
                        <optgroup label="Yoga Judgment Balas">
                            <option value="Ishta">Ishta</option>
                            <option value="Subha">Subha</option>
                            <option value="Cheshta">Cheshta</option>
                            <option value="Uccha">Uccha</option>
                            <option value="Dig">Dig</option>
                            <option value="Veda">Veda</option>
                        </optgroup>
                    </select>
                    <button type="button" class="btn-widget-maximize" title="Maximize Table (Full Screen)" onclick="maximizeTableFromWidget(this)">⛶</button>
                </div>
            </div>
            <div class="responsive-table-container" style="padding: 4px;">
                <div class="scale-wrapper">
                    <table class="quant-matrices-table dignity-grid" style="width: 100%; border-collapse: separate; border-spacing: 0; text-align: center;">
                        <thead>
                            <tr>
                                <th>↓ Giv \ Rec →</th>
                                <th>Su</th>
                                <th>Mo</th>
                                <th>Ma</th>
                                <th>Me</th>
                                <th>Ju</th>
                                <th>Ve</th>
                                <th>Sa</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                        <tfoot>
                            <tr>
                                <td style="background-color: #fcfaf5;"><strong>+</strong></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </template>
