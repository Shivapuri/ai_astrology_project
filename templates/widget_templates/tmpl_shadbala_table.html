<template id="tmpl-shadbala-table">
        <div class="widget-content" id="tab-shadbala-table">
            <div class="chart-toolbar" style="padding: 3px 8px; background: #f7f3eb; border-bottom: 1px solid #e5dccb; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span style="color: #4a3325; font-weight: bold; font-size: 12px;">Shad Bala Breakdown</span>
                    <span style="font-size: 10px; background: #eadecc; color: #5a4233; padding: 1px 4px; border-radius: 3px; font-weight: bold;">D1</span>
                </div>
                <button type="button" class="btn-widget-maximize" title="Maximize Table (Full Screen)" onclick="maximizeTableFromWidget(this)">⛶</button>
            </div>
            <div class="responsive-table-container" style="padding: 4px;">
                <div class="scale-wrapper">
                    <table class="shadbala-breakdown-grid" style="width: 100%; margin-bottom: 10px;">
                        <thead>
                            <tr>
                                <th style="text-align: left; min-width: 140px;">Strength Component</th>
                                <th>Sun</th>
                                <th>Moon</th>
                                <th>Mars</th>
                                <th>Mercury</th>
                                <th>Jupiter</th>
                                <th>Venus</th>
                                <th>Saturn</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>
