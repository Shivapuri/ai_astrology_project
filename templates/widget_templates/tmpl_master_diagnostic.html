<template id="tmpl-master-diagnostic">

                        <thead>
                            <tr>
                                <th class="tooltip-target" data-tooltip="<strong>Graha & Soul</strong><br>• <strong>Graha:</strong> Planetary archetype with motion status ([R] Retrograde, [C] Combust).<br>• <strong>Chara Kāraka:</strong> Soul-level role assigned by longitudinal degree in sign (BPHS Ch. 32): Ātmakāraka (Soul), Amātyakāraka (Career), etc.<br>• <strong>Master Lords (👑):</strong> Lagna Lord, Navamsha Lord, and Drekkana Lord." style="width: 95px; cursor: help;">Graha & Soul</th>
                                <th class="tooltip-target" data-tooltip="<strong>Placement & Functional Role</strong><br>• <strong>Sign & House:</strong> Whole Sign house placement plus 3D Campanus Bhava shift.<br>• <strong>House Rulerships:</strong> Houses governed by this planet.<br>• <strong>Functional Titles:</strong> Yogakāraka (supreme benefic), Lagneśa (ascendant lord), Māraka (threshold), Bādhaka (karmic test)." style="width: 120px; cursor: help;">Placement & Role</th>

                                <th class="tooltip-target" data-tooltip="<strong>Kinetic Muscle (Shadbala Horsepower)</strong><br>• Parashara's cumulative physical horsepower system across 6 pillars (Positional, Directional, Temporal, Motional, Natural, and Aspectual).<br>• Displays Total Virūpas/Rūpas, % of required minimum threshold, relative chart rank (#1 to #7), and Karmic Fruit (Ishta/Kashta).<br>• For Rahu/Ketu: Inherits proxy muscle via host dispositor." style="width: 105px; cursor: help;">Kinetic Muscle (Shadbala)</th>
                                <th class="tooltip-target" data-tooltip="<strong>Environmental Vision (Aspects &amp; Yuti)</strong><br>• <strong>Yuti:</strong> Physical companions sharing the same sign, with conjunction orbs and commanding precedence.<br>• <strong>Dṛṣṭi:</strong> Line-of-sight vision and gaze in Virūpas (Śubha Dṛṣṭi supportive, Pāpa Dṛṣṭi confrontational). Key aspects (&gt; 20v) highlighted with qualitative synthesis.<br>• <strong>Badges:</strong> Graha Yuddha (war), Combustion, and classical nodal/affliction yogas." style="width: 130px; cursor: help;">Environmental Vision (Aspects/Yuti)</th>
                                <th class="tooltip-target" data-tooltip="<strong>Subconscious Drive (Nakshatra)</strong><br>• <strong>Deity:</strong> Presiding Vedic archetype shaping inner motivation.<br>• <strong>Overlord:</strong> Planetary ruler dictating the underlying agenda and Vimshottari timeline.<br>• <strong>Nature &amp; Drive:</strong> Innate temperament and cosmic purpose." style="width: 120px; cursor: help;">Subconscious Drive (Nakshatra)</th>
                                <th class="tooltip-target" data-tooltip="<strong>Avasthās: Age, Alertness &amp; Social Weather</strong><br>• <strong>1. Physical Fuel &amp; Age (Bālādi - BPHS 45.3 / Vol 2):</strong> Biological maturity based on degrees in odd vs. even signs (Bala infant, Kumara youth, Yuva prime adult, Vriddha elder, Mrita dormant).<br>• <strong>2. Conscious Alertness (Jāgradādi - BPHS 45.5):</strong> Alertness &amp; house management capacity (Jagrat awake 100%, Svapna sleepy 50%, Sushupti asleep 10%).<br>• <strong>3. Innate Mood (Dīptādi - BPHS 45.7):</strong> Subjective mood from sign dignity (Pramudita joyous, Deepta radiant, Swastha confident, Santa peaceful, Bhita alarmed).<br>• <strong>4. Social Weather (Lajjitādi - BPHS 45.11):</strong> Relational dynamics from other planets (Mudita supported, Garvita proud, Kshudhita starved, Kshobhita agitated, Lajjita ashamed, Trushita thirsty)." style="width: 100px; cursor: help;">Avasthās &amp; Age</th>
                                <th class="tooltip-target" data-tooltip="<strong>★ Final Archetype & Actualized Vitality (1–10)</strong><br>• <strong>Behavioral Archetypes (9-Tier + Transmuted Hero):</strong> High Dignity (Generous King, Noble Guardian, Sincere Friend), Neutral Dignity (Pragmatic Executive, Dutiful Realist, Modest Citizen), Low Dignity (Armed Dictator, Embattled Striver, Toothless Bully), and Transmuted Hero (Neecha Bhanga).<br>• <strong>Vitality Score (1.0 to 10.0):</strong> Actualized real-world manifesting power.<br>• <strong>Hover Receipt:</strong> Hover over the score cell to inspect the step-by-step mathematical calculation receipt." style="width: 125px; text-align: center; cursor: help;">★ Final Archetype & Vitality</th>
