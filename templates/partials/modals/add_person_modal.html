    <div class="modal-overlay" id="addPersonModal" onclick="if(event.target===this) this.style.display='none'">
        <div class="modal-card" onclick="event.stopPropagation()" style="max-width: 520px; width: 90%;">
            <div class="modal-header">
                <h2 id="nativeModalTitle">Add / Edit Person</h2>
                <button type="button" class="modal-close-btn" onclick="document.getElementById('addPersonModal').style.display='none'">×</button>
            </div>
            <div class="setting-section">
                <input type="hidden" id="editNativeId" value="">
                <div>
                    <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Full Name</label>
                    <input type="text" id="newName" placeholder="e.g. Swami Shivapuri" required style="width:100%; box-sizing:border-box;">
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Date of Birth (DD/MM/YYYY)</label>
                        <input type="text" id="newDate" placeholder="DD/MM/YYYY" required style="width:100%; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Time of Birth (HH:MM:SS)</label>
                        <input type="time" id="newTime" step="1" required style="width:100%; box-sizing:border-box;">
                    </div>
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div style="flex:1.2;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">City / Place of Birth</label>
                        <input type="text" id="newPlace" placeholder="e.g. Mathura, Los Angeles, Budapest" style="width:100%; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Country</label>
                        <select id="countrySelect" onchange="loadCities()" style="width:100%; box-sizing:border-box;">
                            <option value="">-- Country --</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Preset City</label>
                        <select id="citySelect" onchange="fetchTimezone()" style="width:100%; box-sizing:border-box;" disabled>
                            <option value="">-- City --</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Latitude (Decimal)</label>
                        <input type="number" id="newLat" placeholder="e.g. 52.2030" step="0.0001" required style="width:100%; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Longitude (Decimal)</label>
                        <input type="number" id="newLon" placeholder="e.g. 8.0448" step="0.0001" required style="width:100%; box-sizing:border-box;">
                    </div>
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;">
                            <label style="font-size:11px; font-weight:600; color:#4b5563; margin-bottom:0;">Timezone (±HH:MM)</label>
                            <span onclick="detectTimezoneFromCoords()" style="cursor:pointer; color:#2563eb; font-size:10px; font-weight:600;" title="Auto-detect timezone from Lat/Lon and Date">⚡ Auto</span>
                        </div>
                        <input type="text" id="newTz" placeholder="+01:00" value="+00:00" required style="width:100%; box-sizing:border-box;">
                    </div>
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Name Sound Value (Varnamashka)</label>
                    <select id="newNameSoundValue" style="width:100%; box-sizing:border-box;">
                        <option value="0">Auto-detect Sound (Varnamashka) from Name</option>
                        <option value="1">1: A, AA, K, CH, T, P, Y, SH, Q</option>
                        <option value="2">2: I, EE, KH, CHH, TH, F, PH, R</option>
                        <option value="3">3: U, OO, G, J, D, B, L, S, Z</option>
                        <option value="4">4: E, AI, GH, JH, DH, BH, V, W, H</option>
                        <option value="5">5: O, AU, NG, NY, N, M</option>
                    </select>
                </div>
                <div style="margin-top:10px;">
                    <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Notes / Rodden Rating / Biography</label>
                    <textarea id="newNotes" rows="2" placeholder="Optional notes, Rodden rating, birth record source..." style="width:100%; box-sizing:border-box; resize:vertical; font-size:12px; font-family:inherit; padding:6px; border:1px solid #d1d5db; border-radius:4px;"></textarea>
                </div>
                <div style="display:flex; gap:10px; margin-top:10px; align-items:flex-end;">
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:600; color:#4b5563; display:block; margin-bottom:3px;">Category / Section</label>
                        <select id="newCategory" style="width:100%; box-sizing:border-box;">
                            <option value="General">General</option>
                            <option value="Personal">Personal / Family</option>
                            <option value="Spiritual">Spiritual & Sacred</option>
                            <option value="Historical">Historical & Political</option>
                            <option value="Criminals">Criminals & Forensic</option>
                        </select>
                    </div>
                    <div style="flex:1; padding-bottom:6px;">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; font-weight:600; color:#374151; margin:0;">
                            <input type="checkbox" id="newInDropdown" checked style="cursor:pointer; width:16px; height:16px;">
                            <span>📌 Show in Top Dropdown</span>
                        </label>
                    </div>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:20px;">
                <button type="button" onclick="deleteCurrentNative()" id="deleteNativeBtn" style="display:none; background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer;" title="Delete this native permanently">🗑️ Delete</button>
                <div style="display:flex; gap:8px; margin-left:auto;">
                    <button type="button" onclick="document.getElementById('addPersonModal').style.display='none'" style="background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button type="button" onclick="saveNative(false)" id="saveAsNewBtn" style="background-color: #e5e7eb; color: #1f2937; border: 1px solid #d1d5db; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Save as New</button>
                    <button type="button" onclick="saveNative(true)" id="updateBtn" style="display:none; background-color: #10b981; color: white; border: none; padding: 6px 14px; font-weight: 600; border-radius: 4px; cursor: pointer;">💾 Save Changes</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Settings Modal Window -->
